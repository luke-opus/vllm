name: RISE native scalar BF16 comparisons

"on":
  workflow_dispatch:
  push:
    branches:
      - riscv-rise-scalar-validation

permissions:
  contents: read

concurrency:
  group: rise-scalar-bf16-tests
  cancel-in-progress: false

jobs:
  scalar-bf16:
    if: github.repository == 'luke-opus/vllm' && github.ref == 'refs/heads/riscv-rise-scalar-validation'
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Record the machine and compare the real scalar conversion headers
        env:
          LC_ALL: C
        run: |
          set -euo pipefail
          ulimit -c 0
          task_root="$GITHUB_WORKSPACE/rise-scalar-work/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$task_root"/{machine,setup,payload,results}

          finish() {
            result=$?
            trap - EXIT INT TERM
            set +e
            for logfile in "$task_root"/machine/*.txt "$task_root"/setup/*.txt \
                "$task_root"/results/*.txt "$task_root"/results/*.tsv; do
              [[ -f "$logfile" ]] || continue
              printf '\n--- %s ---\n' "${logfile#"$task_root/"}"
              if ! cat "$logfile"; then
                if [[ "$result" == 0 ]]; then result=1; fi
              fi
            done
            {
              echo '## Scalar BF16 production-header comparison'
              echo "- Workflow step exit status: $result"
              echo '- Raw source identities, compilation, execution and exit statuses are printed above.'
              echo '- This covers the shared scalar helper; no RVV, ERF, full-vLLM, model or performance result is implied.'
              echo '- Provider-advertised native hardware is not independently attested by a label or CPU metadata.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$result"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          uname -a > "$task_root/machine/uname.txt"
          cat /etc/os-release > "$task_root/machine/os-release.txt"
          cat /proc/cpuinfo > "$task_root/machine/cpuinfo.txt"
          awk '/^(MemTotal|MemAvailable|SwapTotal):/ { print }' /proc/meminfo \
            > "$task_root/machine/memory.txt"
          df -h "$task_root" > "$task_root/machine/disk.txt"
          for node in /proc/device-tree/model /proc/device-tree/compatible; do
            if [[ -r "$node" ]]; then
              printf '%s\n' "$node" >> "$task_root/machine/device-tree.txt"
              tr '\0' '\n' < "$node" >> "$task_root/machine/device-tree.txt"
            fi
          done
          [[ "$(uname -s)" == Linux && "$(uname -m)" == riscv64 ]]
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -qx 'VERSION_ID="24.04"' /etc/os-release
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'payload_commit=%s\n' "$GITHUB_SHA" > "$task_root/setup/payload-source.txt"

          missing=()
          for package in g++-13 git curl ca-certificates coreutils; do
            if ! dpkg-query -W -f='${Status}\n' "$package" 2>/dev/null \
                | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '%s\n' "${missing[@]}" > "$task_root/setup/missing-packages.txt"
            timeout 900 sudo -n apt-get -o Acquire::Retries=3 update \
              > "$task_root/setup/apt-update.txt" 2>&1
            timeout 900 sudo -n env DEBIAN_FRONTEND=noninteractive \
              apt-get -o Acquire::Retries=3 install -y --no-install-recommends "${missing[@]}" \
              > "$task_root/setup/apt-install.txt" 2>&1
          fi

          for filename in run.sh convert_test.cpp; do
            curl --http1.1 --fail --location --silent --show-error \
              --retry 3 --retry-delay 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "https://raw.githubusercontent.com/luke-opus/vllm/$GITHUB_SHA/main-integration/native-plan/$filename" \
              -o "$task_root/payload/$filename" \
              >> "$task_root/setup/payload-download.txt" 2>&1
            sha256sum "$task_root/payload/$filename" >> "$task_root/setup/payload-source.txt"
          done

          git init "$task_root/source-refs" > "$task_root/setup/git-init.txt" 2>&1
          git -C "$task_root/source-refs" remote add origin https://github.com/luke-opus/vllm.git
          git -C "$task_root/source-refs" config remote.origin.promisor true
          git -C "$task_root/source-refs" config remote.origin.partialclonefilter blob:none
          timeout 600 git -c http.version=HTTP/1.1 -C "$task_root/source-refs" \
            fetch --filter=blob:none --depth=1 origin \
            e0d00e4b8eb0c89ec30921d0695cfdd409e9c211 \
            6592612016059859dff1e93bd534edc1a5737615 \
            > "$task_root/setup/git-fetch.txt" 2>&1
          CXX_BF16=g++-13 bash "$task_root/payload/run.sh" \
            "$task_root/source-refs" "$task_root/results" \
            > "$task_root/setup/run.txt" 2>&1
